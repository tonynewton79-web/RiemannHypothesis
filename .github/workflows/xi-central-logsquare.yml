name: Theta central log-square moment numeric cross-check
on:
  push:
    paths:
      - 'certificates/xi_central_logsquare_numeric.py'
      - '.github/workflows/xi-central-logsquare.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quadrature-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install 'numpy==2.1.3' 'scipy==1.14.1'
      - name: Independent theta double-integral grids 320 and 500
        run: python certificates/xi_central_logsquare_numeric.py
