name: Theta heat-flow Laguerre hierarchy audit
on:
  push:
    paths:
      - 'certificates/xi_heat_flow_hierarchy_tests.py'
      - 'XiKernel/HeatFlowLaguerre.lean'
      - '.github/workflows/xi-heat-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heat-flow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic and high-precision dependencies
        run: python -m pip install 'sympy==1.13.3' 'mpmath==1.3.0'
      - name: Exact Laguerre heat hierarchy, rational Gaussian and theta checks
        run: python certificates/xi_heat_flow_hierarchy_tests.py
