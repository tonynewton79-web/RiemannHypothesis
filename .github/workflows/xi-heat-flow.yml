name: Theta heat-flow Laguerre hierarchy audit
on:
  push:
    paths:
      - 'certificates/xi_heat_flow_hierarchy_tests.py'
      - 'certificates/xi_heat_double_zero_test.py'
      - 'XiKernel/HeatFlowDoubleZeroObstruction.lean'
      - 'XiKernel/HeatFlowLaguerre.lean'
      - 'XiKernel/AdjacentLaguerreRatio.lean'
      - 'XiKernel/HeatCollisionRate.lean'
      - 'certificates/xi_heat_collision_envelope_exact.py'
      - 'certificates/xi_adjacent_ratio_heat_exact.py'
      - 'certificates/xi_heat_six_band_exact.py'
      - '.github/workflows/xi-heat-flow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heat-flow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned symbolic and high-precision dependencies
        run: python -m pip install 'sympy==1.13.3' 'mpmath==1.3.0'
      - name: Exact Laguerre heat hierarchy, rational Gaussian and theta checks
        run: python certificates/xi_heat_flow_hierarchy_tests.py
      - name: Exact Gaussian heat double-zero obstruction
        run: python certificates/xi_heat_double_zero_test.py

      - name: Exact collision time-singularity and inverse-gap tests
        run: python certificates/xi_heat_collision_envelope_exact.py
      - name: Adjacent-order ratio PDE and genuine-theta diagnostic
        run: python certificates/xi_adjacent_ratio_heat_exact.py
      - name: Certified-moment all-order six-unit theta heat comparison
        run: python certificates/xi_heat_six_band_exact.py
