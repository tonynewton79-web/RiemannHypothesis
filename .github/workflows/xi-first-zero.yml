name: First Xi zero rigorous interval-Simpson certificate
on:
  push:
    paths:
      - 'certificates/xi_first_zero_interval.py'
      - '.github/workflows/xi-first-zero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  first-zero-disk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned directed interval package
        run: python -m pip install 'mpmath==1.3.0'
      - name: First complete interval-Simpson enclosure (8192 panels)
        run: python certificates/xi_first_zero_interval.py
      - name: Independent tighter enclosure (16384 panels)
        env:
          XI_ZERO_SIMPSON_N: '16384'
        run: python certificates/xi_first_zero_interval.py
