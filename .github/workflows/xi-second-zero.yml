name: Second Xi zero rigorous interval-Simpson certificate
on:
  push:
    paths:
      - 'certificates/xi_second_zero_interval.py'
      - '.github/workflows/xi-second-zero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  second-zero-disk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install directed interval dependency
        run: python -m pip install 'mpmath==1.3.0'
      - name: Complete second-zero interval certificate (16384 panels)
        env:
          XI_SECOND_N: '16384'
        run: python certificates/xi_second_zero_interval.py
      - name: Independent finer interval certificate (32768 panels)
        env:
          XI_SECOND_N: '32768'
        run: python certificates/xi_second_zero_interval.py
