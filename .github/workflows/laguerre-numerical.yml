name: Numerical Xi Laguerre sweep (not proof)
on:
  push:
    paths:
      - 'certificates/generalized_laguerre_scan.py'
      - 'certificates/xi_arithmetic_incomplete_gamma_replay.py'
      - 'certificates/gaussian_parity_repair_numerical.py'
      - 'certificates/xi_complex_strip_numerical.py'
      - '.github/workflows/laguerre-numerical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  laguerre-numerical:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical high-precision dependency
        run: python -m pip install 'mpmath==1.3.0'
      - name: Compare true theta transform and completed zeta function
        run: python certificates/generalized_laguerre_scan.py
      - name: Independently replay incomplete-gamma Xi arithmetic and m=2 cancellation
        run: python certificates/xi_arithmetic_incomplete_gamma_replay.py
      - name: Numerical 52-digit Gaussian parity-repair L1 cross-check
        run: python certificates/gaussian_parity_repair_numerical.py
      - name: Replay holomorphic Xi complex-strip arithmetic vs zeta
        run: python certificates/xi_complex_strip_numerical.py
