name: Fourth Xi zero three-mode local interval certificate
on:
  push:
    paths:
      - 'certificates/xi_fourth_zero_local_adaptive.py'
      - '.github/workflows/xi-fourth-zero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fourth-zero-disk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned mpmath interval library
        run: python -m pip install 'mpmath==1.3.0'
      - name: Coarse independent local-interval Simpson proof
        env:
          XI_FOURTH_N: '24576'
        run: python certificates/xi_fourth_zero_local_adaptive.py
      - name: Refined independent local-interval Simpson proof
        env:
          XI_FOURTH_N: '32768'
        run: python certificates/xi_fourth_zero_local_adaptive.py
