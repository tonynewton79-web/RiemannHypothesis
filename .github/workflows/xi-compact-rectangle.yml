name: Genuine theta compact heat-frequency rectangle
on:
  push:
    paths:
      - 'certificates/xi_first_compact_theta_rectangle.py'
      - '.github/workflows/xi-compact-rectangle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theta-first-rectangle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned outward interval arithmetic
        run: python -m pip install 'mpmath==1.3.0'
      - name: Full rectangle moment certificate (8192 Simpson panels)
        env:
          XI_RECT_N: '8192'
        run: python certificates/xi_first_compact_theta_rectangle.py
      - name: Independent refinement (16384 Simpson panels)
        env:
          XI_RECT_N: '16384'
        run: python certificates/xi_first_compact_theta_rectangle.py
