name: Exact interval certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove fifth-iterate interval with directed integer arithmetic
        run: python certificates/xi_fifth_iterate_exact.py
      - name: Prove global positive Xi theta curvature by exact interval and analytic tail
        run: python certificates/xi_global_curvature_exact.py
      - name: Check Gaussian-cosh radial curvature and Fourier Laguerre obstruction
        run: python certificates/gaussian_cosh_fourier_obstruction.py
      - name: Check every finite-depth Laguerre coefficient gate to order 100
        run: python certificates/finite_depth_laguerre_exact.py
      - name: Check near-real nonreal zeros invisible to arbitrary finite Laguerre depth
        run: python certificates/near_real_finite_depth_exact.py
      - name: Verify theta square-lattice uniform derivative and Laguerre error constants
        run: python certificates/xi_square_lattice_uniform_tail.py
      - name: Verify modular odd-jet and spurious finite-cutoff Laguerre signs
        run: python certificates/xi_modular_odd_jet_exact.py
      - name: Verify Gaussian parity repair, Laguerre shift and uniform approximation gates
        run: python certificates/gaussian_parity_repair_exact.py
      - name: Certify complex Xi strip theta exponent and Rouche modulus gates
        run: python certificates/xi_complex_strip_exact.py
      - name: Exact theta heat-flow square-lattice gamma-tail coefficient audit
        run: python certificates/xi_theta_heat_tail_exact.py
      - name: Exact double-root heat-flow Laguerre transversality test
        run: python certificates/xi_heat_double_root_transversality_exact.py
      - name: Check spatial Laguerre comparison, zero-gap and collision gates
        run: python certificates/xi_spatial_comparison_exact.py
      - name: Exact 445-case spatial multiplicity and Duhamel zero-compatibility audit
        run: python certificates/xi_spatial_equivalence_exact.py
      - name: Exact two-frequency Duhamel and atomic heat source gates
        run: |
          python -m pip install 'sympy==1.13.3'
          python certificates/xi_heat_duhamel_source_exact.py
      - name: Theta Gaussian-mixture impossibility rational checks
        run: python certificates/xi_theta_mixture_no_go_exact.py
      - name: Exact close-pair inverse-gap certificate and density matched spatial test
        run: python certificates/xi_spatial_gap_density_obstruction.py
      - name: Exact Duhamel source saturation and reverse covariance tests
        run: python certificates/xi_duhamel_order_saturation_exact.py
      - name: Signed theta conditional-slice obstruction exact atomic and two-mesh diagnostics
        run: python certificates/xi_theta_conditional_slice_attack.py
      - name: Quantitative spatial defect and collision exact rational tests
        run: python certificates/xi_spatial_defect_stability_exact.py
      - name: Exact constant-penalty collision and negative-region test
        run: python certificates/xi_penalty_defect_limit_exact.py
      - name: Exact quantitative Duhamel penalty sandwich and Gaussian averaging tests
        run: python certificates/xi_penalty_quantitative_exact.py
      - name: Exact one-point theta Duhamel witness, negative-mass and scalar-normalization algebra
        run: python certificates/xi_central_duhamel_exact.py
      - name: Exact joint theta cutoff and unbounded penalty comparison tests
        run: python certificates/xi_joint_penalty_cutoff_exact.py
      - name: Install symbolic test dependency
        run: python -m pip install 'sympy==1.13.3'
      - name: Exact open-slab collision model and multiplicity obstruction
        run: python certificates/xi_open_slab_collision_exact.py
      - name: Exact compact theta spatial comparison transfer audit
        run: python certificates/xi_compact_spatial_transfer_exact.py
      - name: Check exact theta central-moment ratios and order obstruction
        run: python certificates/xi_central_moment_ratio_exact.py
      - name: Exact six-band exponential Gaussian-tail bound
        run: python certificates/xi_six_band_exponential_exact.py
      - name: Exact inverse-gap Jensen and necessary log-square heat coefficient tests
        run: python certificates/xi_heat_log_square_gap_exact.py
      - name: Exact theta extended-band and all-order zero-lattice rational audit
        run: python certificates/xi_zero_lattice_all_orders_exact.py
      - name: Check exact seven-unit theta band and rational source coefficient
        run: python certificates/xi_seven_unit_heat_exact.py
      - name: Test exact midpoint inverse-zero-gap heat inequality
        run: python certificates/xi_midpoint_zero_gap_exact.py
      - name: Division-free theta spectral heat-loss exact fraction tests
        run: python certificates/xi_division_free_spectral_loss_exact.py
      - name: Check exact pole-free nearest-zero Laguerre comparison
        run: python certificates/pole_free_laguerre_exact.py
      - name: Check exact inverse-square one-sided neighbor-zero shielding and gap sensitivity
        run: python certificates/xi_one_sided_shielding_exact.py
      - name: Independent integer polynomial tests
        run: python certificates/check_gaussian_examples.py

      - name: Exact weighted theta mode-pair Fourier sign and modular cancellation gates
        run: python certificates/xi_mode_pair_weighted_exact.py
