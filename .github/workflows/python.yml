name: Exact interval certificate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prove fifth-iterate interval with directed integer arithmetic
        run: python certificates/xi_fifth_iterate_exact.py
      - name: Prove global positive Xi theta curvature by exact interval and analytic tail
        run: python certificates/xi_global_curvature_exact.py
      - name: Check Gaussian-cosh radial curvature and Fourier Laguerre obstruction
        run: python certificates/gaussian_cosh_fourier_obstruction.py
      - name: Check every finite-depth Laguerre coefficient gate to order 100
        run: python certificates/finite_depth_laguerre_exact.py
      - name: Check near-real nonreal zeros invisible to arbitrary finite Laguerre depth
        run: python certificates/near_real_finite_depth_exact.py
      - name: Verify theta square-lattice uniform derivative and Laguerre error constants
        run: python certificates/xi_square_lattice_uniform_tail.py
      - name: Verify modular odd-jet and spurious finite-cutoff Laguerre signs
        run: python certificates/xi_modular_odd_jet_exact.py
      - name: Verify Gaussian parity repair, Laguerre shift and uniform approximation gates
        run: python certificates/gaussian_parity_repair_exact.py
      - name: Certify complex Xi strip theta exponent and Rouche modulus gates
        run: python certificates/xi_complex_strip_exact.py
      - name: Exact theta heat-flow square-lattice gamma-tail coefficient audit
        run: python certificates/xi_theta_heat_tail_exact.py
      - name: Exact double-root heat-flow Laguerre transversality test
        run: python certificates/xi_heat_double_root_transversality_exact.py
      - name: Check spatial Laguerre comparison, zero-gap and collision gates
        run: python certificates/xi_spatial_comparison_exact.py
      - name: Exact 445-case spatial multiplicity and Duhamel zero-compatibility audit
        run: python certificates/xi_spatial_equivalence_exact.py
      - name: Exact two-frequency Duhamel and atomic heat source gates
        run: |
          python -m pip install 'sympy==1.13.3'
          python certificates/xi_heat_duhamel_source_exact.py
      - name: Theta Gaussian-mixture impossibility rational checks
        run: python certificates/xi_theta_mixture_no_go_exact.py
      - name: Exact close-pair inverse-gap certificate and density matched spatial test
        run: python certificates/xi_spatial_gap_density_obstruction.py
      - name: Exact Duhamel source saturation and reverse covariance tests
        run: python certificates/xi_duhamel_order_saturation_exact.py
      - name: Independent integer polynomial tests
        run: python certificates/check_gaussian_examples.py
