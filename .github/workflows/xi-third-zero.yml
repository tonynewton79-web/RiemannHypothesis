name: Third Xi zero interval-Simpson extension
on:
  push:
    paths:
      - 'certificates/xi_third_zero_interval.py'
      - '.github/workflows/xi-third-zero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  third-zero-disk:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned directed-interval arithmetic
        run: python -m pip install 'mpmath==1.3.0'
      - name: Test third-zero interval enclosure (49152 panels)
        env:
          XI_THIRD_N: '49152'
        run: python certificates/xi_third_zero_interval.py
      - name: Independently refine third-zero enclosure (65536 panels)
        env:
          XI_THIRD_N: '65536'
        run: python certificates/xi_third_zero_interval.py
