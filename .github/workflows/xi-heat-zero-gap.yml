name: Xi heat-flow zero-density obstruction arithmetic tests
on:
  push:
    paths:
      - 'XiKernel/HeatZeroGapObstruction.lean'
      - 'certificates/xi_heat_zero_gap_exact.py'
      - '.github/workflows/xi-heat-zero-gap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heat-zero-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic verifier
        run: python -m pip install 'sympy==1.13.3'
      - name: Exact symbolic root-spacing and rational Laguerre checks
        run: python certificates/xi_heat_zero_gap_exact.py
